[package]
name = "agentfence"
version = "0.1.0"
edition = "2021"
description = "A policy-enforced agent treasury on NEAR (work in progress)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
# Direct dependency so #[derive(BorshSerialize)] resolves the `borsh` crate
# name from this manifest (the derive macro looks it up here, not in near-sdk's).
borsh = { version = "1", features = ["derive"] }
# EVM transaction builder; EVM feature only so wasm stays lean.
omni-transaction = { version = "0.5", default-features = false, features = ["evm"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
